name: Gemini production smoke

on:
  push:
    branches:
      - codex/gemini-production-smoke
    paths-ignore:
      - tmp/gemini-production-results/**

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Wait for production deployment
        run: sleep 45

      - name: Generate production samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/gemini-production-results
          token="8d38b390-f351-4af3-9ee9-1da30dc6fe7d"
          for id in \
            kanji_rudder \
            kanji_oar \
            kanji_meng \
            kanji_moe \
            reading_yu \
            reading_ki \
            name_yuki \
            name_taichi \
            name_shinta
          do
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 10 \
              --retry-all-errors \
              --retry-delay 15 \
              --max-time 120 \
              "https://meimay.vercel.app/api/gemini-smoke?token=${token}&id=${id}" \
              > "tmp/gemini-production-results/${id}.json"
          done

      - name: Commit results to temporary branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/gemini-production-results/*.json
          git commit -m "Record Gemini production smoke results [skip smoke]"
          git push
